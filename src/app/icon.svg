<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Three Sheets a Day">
  <rect width="64" height="64" fill="#efe7d6"/>
  <!-- three sheets, fanned and overprinted: the whole idea in one mark -->
  <g style="mix-blend-mode:multiply">
    <rect x="9"  y="14" width="34" height="42" rx="1" fill="#ff4b73" transform="rotate(-9 26 35)"/>
    <rect x="15" y="11" width="34" height="42" rx="1" fill="#1f3fd6" transform="rotate(3 32 32)"/>
    <rect x="21" y="8"  width="34" height="42" rx="1" fill="#ffcf2e" transform="rotate(13 38 29)"/>
  </g>
  <g fill="none" stroke="#16130f" stroke-width="3.5">
    <rect x="9"  y="14" width="34" height="42" rx="1" transform="rotate(-9 26 35)"/>
    <rect x="15" y="11" width="34" height="42" rx="1" transform="rotate(3 32 32)"/>
    <rect x="21" y="8"  width="34" height="42" rx="1" transform="rotate(13 38 29)"/>
  </g>
</svg>
