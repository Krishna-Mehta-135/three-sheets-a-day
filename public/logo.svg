<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Three Sheets a Day">
  <rect width="64" height="64" fill="#efe7d6"/>
  <!-- three sheets fanned out; the inks are semi-transparent and multiply into
       each other, so the overlaps darken the way a real riso pass does -->
  <g stroke-linejoin="miter">
    <rect x="9"  y="14" width="32" height="40" fill="#ff4b73" transform="rotate(-11 26 35)"/>
    <rect x="16" y="11" width="32" height="40" fill="#2f57e8" fill-opacity="0.62" transform="rotate(2 32 32)" style="mix-blend-mode:multiply"/>
    <rect x="23" y="9"  width="32" height="40" fill="#ffcf2e" fill-opacity="0.72" transform="rotate(15 38 29)" style="mix-blend-mode:multiply"/>
    <g fill="none" stroke="#16130f" stroke-width="3.5">
      <rect x="9"  y="14" width="32" height="40" transform="rotate(-11 26 35)"/>
      <rect x="16" y="11" width="32" height="40" transform="rotate(2 32 32)"/>
      <rect x="23" y="9"  width="32" height="40" transform="rotate(15 38 29)"/>
    </g>
  </g>
</svg>
